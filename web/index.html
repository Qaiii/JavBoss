<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f9fafb" />
    <link rel="icon" href="/favicon.ico?v=1" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=1" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=1" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=1" />
    <link rel="manifest" href="/site.webmanifest?v=1" />
    <title>JavBoss</title>
    <script>
      // 首屏防闪烁：在样式应用前恢复上次选择的主题（含自定义配色）。
      // 暗色主题 id / theme-color / 自定义变量名需与 src/theme/themes.js 保持一致。
      ;(function () {
        var darkThemes = { navy: '#0f131c', coffee: '#161008', teal: '#0d1513' }
        var customVars = [
          '--c-primary',
          '--c-bg-page',
          '--c-bg-surface-rgb',
          '--c-text',
          '--c-border-soft',
          '--c-success',
          '--c-warning',
          '--c-error',
        ]
        var customKeys = [
          'primary',
          'bgPage',
          'bgSurface',
          'text',
          'border',
          'success',
          'warning',
          'error',
        ]
        function triplet(hex) {
          var m = /^#?([0-9a-f]{6})$/i.exec(String(hex || '').trim())
          if (!m) return null
          var n = parseInt(m[1], 16)
          return ((n >> 16) & 255) + ' ' + ((n >> 8) & 255) + ' ' + (n & 255)
        }
        function applyCustomColors(root, colors) {
          for (var i = 0; i < customKeys.length; i++) {
            var hex = colors[customKeys[i]]
            if (!hex) continue
            var value = customKeys[i] === 'bgSurface' ? triplet(hex) : hex
            if (value) root.style.setProperty(customVars[i], value)
          }
        }
        try {
          var raw = window.localStorage.getItem('javboss.theme')
          var id = raw ? (JSON.parse(raw) || {}).id : null
          if (!id) return
          if (id === 'custom') {
            var customRaw = window.localStorage.getItem('javboss.theme.custom')
            var custom = customRaw ? JSON.parse(customRaw) : null
            if (custom && (darkThemes[custom.base] || custom.base === 'light')) {
              var root = document.documentElement
              root.dataset.customTheme = '1'
              root.dataset.theme = custom.base
              root.classList.toggle('theme-dark', !!darkThemes[custom.base])
              var meta = document.querySelector('meta[name="theme-color"]')
              if (meta) meta.setAttribute('content', darkThemes[custom.base] || '#f9fafb')
              applyCustomColors(root, custom.colors)
            }
            return
          }
          if (darkThemes[id]) {
            var root2 = document.documentElement
            root2.classList.add('theme-dark')
            root2.dataset.theme = id
            var meta2 = document.querySelector('meta[name="theme-color"]')
            if (meta2) meta2.setAttribute('content', darkThemes[id])
          }
        } catch (e) {
          /* 忽略存储读取失败 */
        }
      })()
    </script>
  </head>
  <body class="bg-gray-50 text-gray-900">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
